<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Preparing YouTube tabs</title><link rel="stylesheet" href="preparation.css"></head>
<body>
<h1>Preparing tabs</h1>
<p id="progress" role="status" aria-live="polite">Connecting…</p>
<p id="current"></p>
<p id="hint">Tabs are visited one at a time. TabSort briefly waits for YouTube to restore saved progress, then puts sleeping tabs back to sleep. A tab that stays unavailable for 15 seconds is skipped. Switching tabs manually stops preparation.</p>
<button id="stop" type="button">Stop</button>
<script type="module" src="preparation.js"></script>
</body></html>
